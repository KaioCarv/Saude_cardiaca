<ion-content class="ion-padding forgot-content">
  <div class="forgot-container">
    <div class="logo-section">
      <ion-icon name="heart-outline" class="logo-icon"></ion-icon>
      <h1>Esqueci a Senha</h1>
      <p>Informe seu e-mail para receber o codigo de redefinicao</p>
    </div>

    <div class="form-section">
      <ion-input
        type="email"
        label="E-mail cadastrado"
        labelPlacement="floating"
        fill="outline"
        [(ngModel)]="email"
        placeholder="seu@email.com"
      ></ion-input>

      <ion-text color="danger" *ngIf="errorMessage">
        <p class="error-text">{{ errorMessage }}</p>
      </ion-text>

      <ion-button
        expand="block"
        (click)="send()"
        [disabled]="loading || !email"
        shape="round"
      >
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        <ion-icon *ngIf="!loading" name="mail-outline" slot="start"></ion-icon>
        {{ loading ? 'Enviando...' : 'Enviar Codigo' }}
      </ion-button>

      <div class="back-link">
        <ion-text color="medium">
          <p><a [routerLink]="['/login']">Voltar para o login</a></p>
        </ion-text>
      </div>
    </div>
  </div>
</ion-content>
