<ion-content class="ion-padding reset-content">
  <div class="reset-container">
    <div class="logo-section">
      <ion-icon name="heart-outline" class="logo-icon"></ion-icon>
      <h1>Nova Senha</h1>
      <p *ngIf="!success">Digite o codigo recebido no e-mail e crie sua nova senha</p>
      <p *ngIf="success">Senha alterada com sucesso!</p>
    </div>

    <div class="form-section" *ngIf="!success">
      <div class="email-info">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <span>{{ email }}</span>
      </div>

      <ion-input
        type="text"
        label="Codigo de verificacao (6 digitos)"
        labelPlacement="floating"
        fill="outline"
        [(ngModel)]="code"
        placeholder="000000"
        maxlength="6"
        inputmode="numeric"
      ></ion-input>

      <ion-input
        type="password"
        label="Nova senha"
        labelPlacement="floating"
        fill="outline"
        [(ngModel)]="newPassword"
        placeholder="Minimo 6 caracteres"
      >
        <ion-input-password-toggle
          slot="end"
          color="medium"
          show-icon="eye-off"
          hide-icon="eye"
        ></ion-input-password-toggle>
      </ion-input>

      <ion-input
        type="password"
        label="Confirmar nova senha"
        labelPlacement="floating"
        fill="outline"
        [(ngModel)]="confirmPassword"
        placeholder="Repita a senha"
      >
        <ion-input-password-toggle
          slot="end"
          color="medium"
          show-icon="eye-off"
          hide-icon="eye"
        ></ion-input-password-toggle>
      </ion-input>

      <ion-text color="danger" *ngIf="errorMessage">
        <p class="error-text">{{ errorMessage }}</p>
      </ion-text>

      <ion-button
        expand="block"
        (click)="reset()"
        [disabled]="loading || !code || !newPassword || !confirmPassword"
        shape="round"
      >
        <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
        <ion-icon *ngIf="!loading" name="lock-closed-outline" slot="start"></ion-icon>
        {{ loading ? 'Salvando...' : 'Redefinir Senha' }}
      </ion-button>

      <div class="back-link">
        <ion-text color="medium">
          <p><a [routerLink]="['/forgot-password']">Reenviar codigo</a></p>
        </ion-text>
      </div>
    </div>

    <div class="success-section" *ngIf="success">
      <ion-icon name="checkmark-circle-outline" class="success-icon"></ion-icon>
      <p>Redirecionando para o login...</p>
    </div>
  </div>
</ion-content>
